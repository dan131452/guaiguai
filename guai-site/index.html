<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>给乖乖的纪念日网站 🐾</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fdfbf3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

<!-- 漂浮小涂鸦 -->
<svg class="doodle d1" width="42" height="42" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="15" rx="4.6" ry="4.1"/><circle cx="5.6" cy="9.6" r="1.8"/><circle cx="10.2" cy="6.6" r="1.8"/><circle cx="13.8" cy="6.6" r="1.8"/><circle cx="18.4" cy="9.6" r="1.8"/></svg>
<svg class="doodle d2" width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M17 3C9.5 3 4.5 7.8 4.5 14.5c0 3.4 2.2 5.6 5.6 5.6C16.8 20.1 21.5 14.5 21.5 8c0-2.8-1.5-5-4.5-5z"/><path d="M19.6 3.4c-1 .3-1.6 1.3-1.4 2.6.6-.4 1-.9 1.4-2.6z" fill="#fff"/></svg>
<svg class="doodle d3" width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
<svg class="doodle d4" width="52" height="52" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="15" rx="4.6" ry="4.1"/><circle cx="5.6" cy="9.6" r="1.8"/><circle cx="10.2" cy="6.6" r="1.8"/><circle cx="13.8" cy="6.6" r="1.8"/><circle cx="18.4" cy="9.6" r="1.8"/></svg>
<svg class="doodle d5" width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><path d="M17 3C9.5 3 4.5 7.8 4.5 14.5c0 3.4 2.2 5.6 5.6 5.6C16.8 20.1 21.5 14.5 21.5 8c0-2.8-1.5-5-4.5-5z"/></svg>
<svg class="doodle d6" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>

<main>
  <!-- ========== Hero ========== -->
  <section class="hero">
    <span class="badge" id="badgeText">🐾 我们在一起啦</span>
    <h1>
      <span class="big" id="days">0</span>
      <span class="unit">天</span>
      和<b id="her1">乖乖</b>在一起的每一天
    </h1>
    <p class="since">从 <span id="sinceDate"></span> 开始的故事，<span id="her2">乖乖</span>，都是关于你的</p>
    <p class="extra" id="exact"></p>
    <div class="paw-row">🐾 🐾 🐾</div>
  </section>

  <!-- ========== 倒计时 ========== -->
  <section class="count-grid">
    <div class="count-card">
      <div class="num" id="c1d">--</div>
      <div class="lbl">距离 <span id="annN">1</span> 周年纪念日<br><span id="annDate">----</span></div>
      <div class="tick" id="c1t"></div>
    </div>
    <div class="count-card">
      <div class="num" id="c2d">--</div>
      <div class="lbl"><span id="c2lbl">距离 100 天纪念日</span><br><span id="d100Date">----</span></div>
      <div class="tick" id="c2t"></div>
    </div>
    <div class="count-card">
      <div class="num" id="c3d">--</div>
      <div class="lbl">今天也是想<span id="her3">乖乖</span>的一天</div>
      <div class="tick" id="c3t">❤️</div>
    </div>
  </section>

  <!-- ========== 为什么是 7.25 ========== -->
  <h2 class="section-title">为什么是 7.25？
    <svg viewBox="0 0 200 12" preserveAspectRatio="none"><path d="M2 8 Q 40 2 80 7 T 160 6 T 198 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
  </h2>
  <div class="hcard c1">
    <span class="sticker">🍀 纪念日</span>
    <button class="card-edit" id="whyEdit" type="button" title="写下 7.25 的故事" hidden>✏️</button>
    <p id="why725" style="font-size:16px;line-height:2;color:var(--ink);"></p>
  </div>

  <!-- ========== 情话小纸条 ========== -->
  <h2 class="section-title">情话小纸条
    <svg viewBox="0 0 200 12" preserveAspectRatio="none"><path d="M2 8 Q 40 2 80 7 T 160 6 T 198 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
  </h2>
  <div class="hcard c2">
    <div class="quote-box">
      <p class="quote-text" id="quote"></p>
      <button class="btn" id="quoteBtn" type="button">再来一句 🐾</button>
    </div>
  </div>
</main>

<footer>
  made with <span class="heart">❤</span> by <b id="me1">宝宝</b> · <span id="startDateF"></span> 是我们故事的开始<br>
  <button id="logoutBtn" class="logout-btn" type="button" hidden>退出登录</button>
</footer>

<!-- ========== 底部导航 ========== -->
<nav class="tabbar">
  <a href="index.html" class="tab active"><span class="ico">🏠</span><span>首页</span></a>
  <a href="1.html" class="tab"><span class="ico">📷</span><span>照片墙</span></a>
  <a href="2.html" class="tab"><span class="ico">✏️</span><span>小事</span></a>
  <a href="3.html" class="tab"><span class="ico">✉️</span><span>信</span></a>
</nav>

<button id="installBtn" class="install-btn" type="button" hidden>📲 把 App 装到桌面</button>

<!-- ========== 登录门禁（配置了 Supabase 才会显示） ========== -->
<div class="login-overlay" id="loginOverlay" hidden>
  <div class="login-card">
    <span class="sticker">🐾 只给我们俩</span>
    <h2>乖乖纪念日</h2>
    <p class="login-sub">这是只属于我们的地方，先对一下暗号～</p>
    <input id="loginUser" class="rec-input" type="text" placeholder="账号" autocomplete="username">
    <input id="loginPass" class="rec-input" type="password" placeholder="密码" autocomplete="current-password">
    <button id="loginGo" class="btn" type="button">进来 🐾</button>
    <p class="form-tip" id="loginTip"></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/main.js"></script>
<script src="js/register-sw.js"></script>
</body>
</html>
