<svg class="doodle d4" width="52" height="52" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="15" rx="4.6" ry="4.1"/><circle cx="5.6" cy="9.6" r="1.8"/><circle cx="10.2" cy="6.6" r="1.8"/><circle cx="13.8" cy="6.6" r="1.8"/><circle cx="18.4" cy="9.6" r="1.8"/></svg>
<svg class="doodle d5" width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><path d="M17 3C9.5 3 4.5 7.8 4.5 14.5c0 3.4 2.2 5.6 5.6 5.6C16.8 20.1 21.5 14.5 21.5 8c0-2.8-1.5-5-4.5-5z"/></svg>

<main>
  <!-- ========== 照片墙 ========== -->
  <section class="hero" style="padding-bottom:0;">
    <span class="badge">📷 我们的照片墙</span>
    <h1 style="font-size:24px;">每一张，都是想<span id="her1">乖乖</span>的证据</h1>
  </section>
  <p class="sub" id="photoUploadTip">点右下角 📷 上传照片，存到云端 🐾</p>
  <div class="photo-grid" id="photoGrid"></div>

  <!-- 上传照片按钮 + 隐藏 file input（手机端 accept image 会调起相册/相机） -->
  <button id="photoUploadBtn" class="photo-fab" type="button" title="上传照片">📷</button>
  <input id="photoFileInput" type="file" accept="image/*" multiple hidden>

  <!-- 盛世美照入口滑窗按钮 -->
  <button id="beautyFab" class="photo-fab beauty-fab" type="button" title="溶宝的盛世美照">💄</button>
</main>

<!-- 盛世美照入口滑窗 -->
<div class="beauty-sheet" id="beautySheet" hidden>
  <div class="beauty-sheet-mask" id="beautySheetMask"></div>
  <div class="beauty-sheet-panel">
    <div class="beauty-sheet-handle"></div>
    <p class="beauty-sheet-title">💄 溶宝的盛世美照</p>
    <div class="beauty-preview-wrap">
      <div class="beauty-preview" id="beautyPreview"></div>
      <p class="beauty-preview-hint" id="beautyPreviewHint" hidden>登录后可以在这里偷看最新 3 张美照 🐾</p>
    </div>
    <p class="beauty-sheet-desc">专属于溶宝的高光时刻相册，上传、看图、下载都在这里</p>
    <div class="beauty-sheet-actions">
      <a class="btn" href="beauty.html">进去看看 🐾</a>
      <button class="btn btn-plain" id="beautySheetClose" type="button">再逛逛</button>
    </div>
  </div>
</div>

<!-- 照片大图查看 / 说明 / 下载 / 删除 -->
<div class="photo-modal" id="photoModal" hidden>
  <button class="photo-modal-close" id="photoModalClose" type="button">✕</button>
  <img id="photoModalImg" src="" alt="">
  <p class="photo-cap-view" id="photoModalCapView" hidden></p>
  <div class="photo-modal-bar">
    <input id="photoModalCap" class="rec-input" type="text" maxlength="30" placeholder="给这张照片写句话…">
    <button class="btn" id="photoModalCapSave" type="button">存说明</button>
    <button class="btn btn-plain" id="photoModalCapDel" type="button" hidden>删说明</button>
    <a class="btn btn-plain" id="photoModalDl" download>⬇️ 下载</a>
    <button class="btn photo-modal-del" id="photoModalDel" type="button">删掉这张</button>
  </div>
  <p class="form-tip" id="photoModalTip"></p>
</div>

<footer>
  made with <span class="heart">❤</span> by <b id="me1">宝宝</b> · <span id="startDateF"></span> 是我们故事的开始<br>
  <button id="logoutBtn" class="logout-btn" type="button" hidden>退出登录</button>
  <button id="exportBtn" class="logout-btn" type="button" hidden>💾 导出备份</button>
  <button id="pushBtn" class="logout-btn" type="button" hidden>🔔 开启互拍提醒</button>
</footer>

<nav class="tabbar">
  <a href="index.html" class="tab"><span class="ico">🏠</span><span>首页</span></a>

  <a href="report.html" class="tab"><span class="ico">🎁</span><span>报告</span></a>
</nav>

<button id="installBtn" class="install-btn" type="button" hidden>📲 把 App 装到桌面</button>

<!-- ========== 登录门禁（配置了 Supabase 才会显示） ========== -->
<div class="login-overlay" id="loginOverlay" hidden>
  <div class="login-card">
    <span class="sticker">🐾 只给我们俩</span>
    <h2>妻爱吾</h2>
    <p class="login-sub">这是只属于我们的地方，先对一下暗号～</p>
    <input id="loginUser" class="rec-input" type="text" placeholder="账号" autocomplete="username">
    <input id="loginPass" class="rec-input" type="password" placeholder="密码" autocomplete="current-password">
    <button id="loginGo" class="btn" type="button">进来 🐾</button>
    <p class="form-tip" id="loginTip"></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/common.js"></script>
<script src="js/photos.js"></script>
<script src="js/beauty-sheet.js"></script>
<script src="js/register-sw.js"></script>
<script src="js/reminders.js"></script>
</body>
</html>
