<svg class="doodle d4" width="52" height="52" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="15" rx="4.6" ry="4.1"/><circle cx="5.6" cy="9.6" r="1.8"/><circle cx="10.2" cy="6.6" r="1.8"/><circle cx="13.8" cy="6.6" r="1.8"/><circle cx="18.4" cy="9.6" r="1.8"/></svg>

<main>
  <!-- ========== 我们的小事 ========== -->
  <section class="hero" style="padding-bottom:0;">
    <span class="badge">✏️ 我们的小事</span>
    <h1 style="font-size:24px;">一点一滴，都值得记下来</h1>
  </section>
  <p class="sub" id="tlSub">🐾 在下面记一笔，两个人都能看到</p>
  <div class="hcard c3">
    <span class="sticker">✏️ 随手记</span>
    <div class="add-form" id="addForm">
      <div class="form-row author-row">
        <span class="author-label">🐾 是谁记的呀</span>
        <button class="author-btn" id="authorMe" type="button"></button>
        <button class="author-btn" id="authorHer" type="button"></button>
      </div>
      <div class="form-row">
        <input type="date" id="recDate" class="rec-input">
      </div>
      <textarea id="recText" class="rec-input" rows="3" maxlength="500" placeholder="今天发生了什么小事？（第一次一起吃饭、突然的惊喜、傻乎乎的瞬间……）"></textarea>
      <div class="form-row form-photo-row">
        <label class="btn photo-btn">📷 选张照片
          <input type="file" id="recPhoto" accept="image/*" hidden>
        </label>
        <span class="photo-name" id="photoName"></span>
        <button class="btn" id="recSave" type="button">记下来 🐾</button>
      </div>
      <img id="photoPreview" class="photo-preview" alt="" hidden>
      <p class="form-tip" id="formTip"></p>
    </div>
    <div class="timeline" id="timeline"></div>
  </div>
</main>

<footer>
  made with <span class="heart">❤</span> by <b id="me1">宝宝</b> · <span id="startDateF"></span> 是我们故事的开始<br>
  <button id="logoutBtn" class="logout-btn" type="button" hidden>退出登录</button>
</footer>

<button id="installBtn" class="install-btn" type="button" hidden>📲 把 App 装到桌面</button>

<!-- ========== 登录门禁（配置了 Supabase 才会显示） ========== -->
<div class="login-overlay" id="loginOverlay" hidden>
  <div class="login-card">
    <span class="sticker">🐾 只给我们俩</span>
    <h2>妻爱吾</h2>
    <p class="login-sub">这是只属于我们的地方，先对一下暗号～</p>
    <input id="loginUser" class="rec-input" type="text" placeholder="账号" autocomplete="username">
    <input id="loginPass" class="rec-input" type="password" placeholder="密码" autocomplete="current-password">
    <button id="loginGo" class="btn" type="button">进来 🐾</button>
    <p class="form-tip" id="loginTip"></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/db.js"></script>

</body>
</html>
